iddle" dominant-baseline="middle"><tspan x="710.0" dy="0">Validate output and evidence</tspan></text><rect x="450" y="1430" width="520" height="100" rx="16" fill="#faf0da" stroke="#a89053" stroke-width="2"/><text x="710.0" y="1480.0" class="node" text-anchor="middle" dominant-baseline="middle"><tspan x="710.0" dy="0">Handler review</tspan></text><rect x="450" y="1590" width="520" height="100" rx="16" fill="#faf0da" stroke="#a89053" stroke-width="2"/><text x="710.0" y="1640.0" class="node" text-anchor="middle" dominant-baseline="middle"><tspan x="710.0" dy="0">Reviewed feedback</tspan></text>
