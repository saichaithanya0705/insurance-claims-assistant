[project]
name = "synapt-claims-investigator"
version = "0.1.0"
description = "Evidence-led claims investigation with LangGraph and Synapt"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=2,<4",
  "httpx>=0.28,<1", "mcp>=1.20,<2",
  "scikit-learn>=1.6,<2", "joblib>=1.4,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
evaluation = ["deepeval>=3,<5"]
search = [
    "fastembed>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims"]
